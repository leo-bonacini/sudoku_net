<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1428"/>
      <stop offset="100%" stop-color="#1e2c56"/>
    </linearGradient>
    <radialGradient id="cornerGlow" cx="18%" cy="14%" r="55%">
      <stop offset="0%" stop-color="#4c6fff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#4c6fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2dd4f0"/>
      <stop offset="100%" stop-color="#b083f7"/>
    </linearGradient>
    <radialGradient id="nodeGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#8ff0ff"/>
      <stop offset="100%" stop-color="#7c6bf0"/>
    </radialGradient>
    <radialGradient id="haloGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5be3ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5be3ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#cornerGlow)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="94.5" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>

  <!-- sudoku grid: 9x9, cells of 35, block area 98.5..413.5 -->
  <g id="grid">
    <!-- thin lines -->
    <g stroke="#8ea3d9" stroke-opacity="0.22" stroke-width="1.4">
      <line x1="133.5" y1="98.5" x2="133.5" y2="413.5"/>
      <line x1="168.5" y1="98.5" x2="168.5" y2="413.5"/>
      <line x1="238.5" y1="98.5" x2="238.5" y2="413.5"/>
      <line x1="273.5" y1="98.5" x2="273.5" y2="413.5"/>
      <line x1="343.5" y1="98.5" x2="343.5" y2="413.5"/>
      <line x1="378.5" y1="98.5" x2="378.5" y2="413.5"/>
      <line x1="98.5" y1="133.5" x2="413.5" y2="133.5"/>
      <line x1="98.5" y1="168.5" x2="413.5" y2="168.5"/>
      <line x1="98.5" y1="238.5" x2="413.5" y2="238.5"/>
      <line x1="98.5" y1="273.5" x2="413.5" y2="273.5"/>
      <line x1="98.5" y1="343.5" x2="413.5" y2="343.5"/>
      <line x1="98.5" y1="378.5" x2="413.5" y2="378.5"/>
    </g>
    <!-- thick block-divider lines + outer border -->
    <g stroke="#b9c6ef" stroke-opacity="0.42" stroke-width="3" stroke-linecap="round">
      <line x1="98.5" y1="98.5" x2="98.5" y2="413.5"/>
      <line x1="203.5" y1="98.5" x2="203.5" y2="413.5"/>
      <line x1="308.5" y1="98.5" x2="308.5" y2="413.5"/>
      <line x1="413.5" y1="98.5" x2="413.5" y2="413.5"/>
      <line x1="98.5" y1="98.5" x2="413.5" y2="98.5"/>
      <line x1="98.5" y1="203.5" x2="413.5" y2="203.5"/>
      <line x1="98.5" y1="308.5" x2="413.5" y2="308.5"/>
      <line x1="98.5" y1="413.5" x2="413.5" y2="413.5"/>
    </g>
  </g>

  <!-- bottom-right block reimagined as a small neural graph -->
  <g id="edges" stroke="url(#edgeGrad)" stroke-opacity="0.65" stroke-width="1.7" stroke-linecap="round">
    <line x1="326" y1="326" x2="361" y2="361"/>
    <line x1="361" y1="326" x2="396" y2="361"/>
    <line x1="326" y1="361" x2="361" y2="396"/>
    <line x1="361" y1="361" x2="396" y2="396"/>
    <line x1="396" y1="326" x2="361" y2="361"/>
    <line x1="326" y1="396" x2="361" y2="361"/>
  </g>

  <g id="nodes">
    <g id="n326-326"><circle cx="326" cy="326" r="17" fill="url(#haloGrad)"/><circle cx="326" cy="326" r="6.5" fill="url(#nodeGrad)" stroke="#0b1024" stroke-width="1.2"/></g>
    <g id="n361-326"><circle cx="361" cy="326" r="17" fill="url(#haloGrad)"/><circle cx="361" cy="326" r="6.5" fill="url(#nodeGrad)" stroke="#0b1024" stroke-width="1.2"/></g>
    <g id="n396-326"><circle cx="396" cy="326" r="17" fill="url(#haloGrad)"/><circle cx="396" cy="326" r="6.5" fill="url(#nodeGrad)" stroke="#0b1024" stroke-width="1.2"/></g>
    <g id="n326-361"><circle cx="326" cy="361" r="17" fill="url(#haloGrad)"/><circle cx="326" cy="361" r="6.5" fill="url(#nodeGrad)" stroke="#0b1024" stroke-width="1.2"/></g>
    <g id="n361-361"><circle cx="361" cy="361" r="19" fill="url(#haloGrad)"/><circle cx="361" cy="361" r="7.5" fill="url(#nodeGrad)" stroke="#0b1024" stroke-width="1.2"/></g>
    <g id="n396-361"><circle cx="396" cy="361" r="17" fill="url(#haloGrad)"/><circle cx="396" cy="361" r="6.5" fill="url(#nodeGrad)" stroke="#0b1024" stroke-width="1.2"/></g>
    <g id="n326-396"><circle cx="326" cy="396" r="17" fill="url(#haloGrad)"/><circle cx="326" cy="396" r="6.5" fill="url(#nodeGrad)" stroke="#0b1024" stroke-width="1.2"/></g>
    <g id="n361-396"><circle cx="361" cy="396" r="17" fill="url(#haloGrad)"/><circle cx="361" cy="396" r="6.5" fill="url(#nodeGrad)" stroke="#0b1024" stroke-width="1.2"/></g>
    <g id="n396-396"><circle cx="396" cy="396" r="17" fill="url(#haloGrad)"/><circle cx="396" cy="396" r="6.5" fill="url(#nodeGrad)" stroke="#0b1024" stroke-width="1.2"/></g>
  </g>
</svg>
